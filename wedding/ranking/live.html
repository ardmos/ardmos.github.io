<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>실시간 랭킹 (관리용)</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>실시간 랭킹 <span class="badge live">LIVE</span></h1>
      <div class="meta">점수 높은 순 · 동점이면 먼저 기록한 순 · 전화번호 전체 표시</div>
    </header>
    <nav class="nav" aria-label="스냅샷 이동">
      <a class="active" href="./live.html">실시간</a>
      <a href="./0900.html">09:00</a>
      <a href="./1000.html">10:00</a>
      <a href="./1100.html">11:00</a>
    </nav>
    <div id="status" class="meta">불러오는 중…</div>
    <div class="card" style="margin-top:10px">
      <div id="root" class="empty">데이터를 불러오는 중입니다.</div>
    </div>
    <p class="foot">관리용 페이지입니다. 검색엔진 색인 제외(noindex). 30초마다 자동 새로고침.</p>
  </div>
  <script>
  (function () {
    const PROJECT = 'my-wedding-invitation-efd31';
    const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/rankings';

    function field(doc, name) {
      const f = doc.fields && doc.fields[name];
      if (!f) return null;
      if (f.stringValue != null) return f.stringValue;
      if (f.integerValue != null) return Number(f.integerValue);
      if (f.timestampValue != null) return Date.parse(f.timestampValue);
      return null;
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmtPhone(p) {
      const d = String(p || '').replace(/\D/g, '');
      if (d.length === 11) return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
      if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
      return p || '';
    }
    async function fetchAll() {
      const out = [];
      let token = null;
      do {
        const url = BASE + '?pageSize=300' + (token ? ('&pageToken=' + encodeURIComponent(token)) : '');
        const r = await fetch(url);
        if (!r.ok) throw new Error('Firestore ' + r.status);
        const j = await r.json();
        (j.documents || []).forEach(d => out.push(d));
        token = j.nextPageToken || null;
      } while (token);
      return out.map(d => ({
        nickname: field(d, 'nickname') || '(이름없음)',
        phone: field(d, 'phoneNumber') || '',
        score: Number(field(d, 'bestScore') || 0),
        plays: Number(field(d, 'playCount') || 0),
        at: Number(field(d, 'bestScoreAt') || 0)
      })).sort((a,b) => (b.score - a.score) || (a.at - b.at));
    }
    function render(rows) {
      const root = document.getElementById('root');
      const status = document.getElementById('status');
      status.textContent = '총 ' + rows.length + '명 · 갱신 ' + new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) + ' (KST)';
      if (!rows.length) {
        root.className = 'empty';
        root.innerHTML = '<strong>아직 기록이 없습니다</strong>게임을 플레이하면 여기에 표시됩니다.';
        return;
      }
      root.className = '';
      root.innerHTML = '<table><thead><tr><th>순위</th><th>닉네임</th><th>전화번호</th><th>점수</th><th>플레이</th></tr></thead><tbody>' +
        rows.map((e,i) => '<tr><td class="rank">' + (i+1) + '</td><td class="nick">' + esc(e.nickname) +
          '</td><td class="phone">' + esc(fmtPhone(e.phone)) +
          '</td><td class="score">' + e.score.toLocaleString('ko-KR') +
          '</td><td class="plays">' + e.plays.toLocaleString('ko-KR') + '</td></tr>').join('') +
        '</tbody></table>';
    }
    async function tick() {
      try {
        render(await fetchAll());
      } catch (e) {
        document.getElementById('status').textContent = '불러오기 실패';
        document.getElementById('root').className = 'err';
        document.getElementById('root').textContent = String(e && e.message || e);
      }
    }
    tick();
    setInterval(tick, 30000);
  })();
  </script>
</body>
</html>
